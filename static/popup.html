<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gatebreak</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="icons/32.png" alt="" width="28" height="28" /><span>Gatebreak</span>
      </div>
      <label class="toggle"
        ><input id="enabled" type="checkbox" checked /><span>Enabled</span></label
      >
    </header>
    <main>
      <h1 id="gate-title">Open a Hypeddit gate</h1>
      <p id="state" class="state" role="status" aria-live="polite">Waiting for a gate</p>
      <p id="steps" class="steps" hidden></p>
      <p id="description" aria-live="polite">
        Visit a download gate on hypeddit.com, then reopen Gatebreak.
      </p>
      <button id="resolve" type="button" disabled>Try skipping gates</button>
      <a id="download" class="download" target="_blank" rel="noopener noreferrer" hidden
        >Open download</a
      >
    </main>
    <footer>
      <span>No email. No social login.</span
      ><a href="https://github.com/DavidNiessen/gatebreak" target="_blank" rel="noopener noreferrer"
        >Source &amp; help</a
      >
    </footer>
  </body>
</html>
